{% extends "base.html" %}

{% block title %}Register - EcoPredict AI{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 480px; margin: 2rem auto;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🌱</div>
        <h2 style="color: var(--dark); font-weight: 700;">Create User Account</h2>
        <p style="color: var(--muted); font-size: 0.9rem;">Join the Environmental Carbon Monitoring Platform</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group" style="margin-bottom: 1.1rem;">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Dr. A. Kumar" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.1rem;">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="e.g. user@domain.com" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.1rem;">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
            Create Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; font-size: 0.9rem;">
        <p style="color: var(--muted);">Already registered? <a href="{{ url_for('login') }}" style="font-weight: 600;">Sign in here</a></p>
    </div>
</div>
{% endblock %}
