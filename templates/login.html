{% extends "base.html" %}

{% block title %}Login - EcoPredict AI{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 420px; margin: 3rem auto;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🌿</div>
        <h2 style="color: var(--dark); font-weight: 700;">Account Login</h2>
        <p style="color: var(--muted); font-size: 0.9rem;">Sign in to access Carbon Analytics & Predictions</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group" style="margin-bottom: 1.2rem;">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="e.g. demo@carbon.ai" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
            Sign In
        </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; font-size: 0.9rem;">
        <p style="color: var(--muted);">Don't have an account? <a href="{{ url_for('register') }}" style="font-weight: 600;">Register here</a></p>
        <p style="font-size: 0.8rem; color: var(--muted); margin-top: 0.75rem; background: var(--light-bg); padding: 0.5rem; border-radius: 6px;">
            🔑 <strong>Demo Credentials:</strong><br>
            Email: <code>demo@carbon.ai</code> | Password: <code>admin123</code>
        </p>
    </div>
</div>
{% endblock %}
